async:
  shared:
    enabled: true

platform:
  shared:
    enabled: true
    serviceAccount:
      name: "existing-service-account"

externalSecrets:
  secretStore:
    create: true
    annotations:
      example.com/owner: "limina"
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::111122223333:role/limina-secret-store"
    provider:
      aws:
        service: "SecretsManager"
        region: "ca-central-1"
  dockerCredential:
    enabled: true
  core:
    enabled: true
    env:
      enabled: true
    tls:
      enabled: true
  async:
    enabled: true
    api:
      tls:
        enabled: true
  platform:
    enabled: true
    shared:
      env:
        properties:
          - secretKey: "REDIS_PASSWORD"
          - secretKey: "POSTGRES_USER"
            remoteRefKey: "rds!db-00000000-0000-0000-0000-000000000000"
            property: "username"
          - secretKey: "POSTGRES_PASSWORD"
            remoteRefKey: "rds!db-00000000-0000-0000-0000-000000000000"
            property: "password"
    ui:
      env:
        properties:
          - secretKey: "BETTER_AUTH_SECRET"
          - secretKey: "GOOGLE_CLIENT_SECRET"
            property: "OAUTH_CLIENT_SECRET"
      tls:
        enabled: true
