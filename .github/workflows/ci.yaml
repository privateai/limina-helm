name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v5

      - name: Setup helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: make ci
