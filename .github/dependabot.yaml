version: 2
updates:
  - package-ecosystem: "helm"
    directories:
      - "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    groups:
      helm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    cooldown:
      default-days: 7
    groups:
      actions-packages:
        patterns:
          - "*"
