{{- if and .Values.platform.shared.enabled .Values.platform.shared.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "limina.platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.platform.shared.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
{{- end }}
