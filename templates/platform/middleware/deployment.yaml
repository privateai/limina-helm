{{- if .Values.platform.shared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "limina.fullname" . }}-middleware
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.platform.middleware.deployment.replicaCount }}
  selector:
    {{- with .Values.platform.middleware.deployment.selector.matchLabels }}
    matchLabels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  strategy:
    type: {{ .Values.platform.middleware.deployment.strategy.type }}
  template:
    metadata:
      {{- with .Values.platform.middleware.deployment.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.platform.middleware.deployment.selector.matchLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with include "limina.platform.serviceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name }}
      {{- with .Values.platform.middleware.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: {{ include "limina.fullname" . }}-middleware-migrate
          image: {{ include "limina.image" (dict "image" .Values.platform.middleware.deployment.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.platform.middleware.deployment.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          {{- if or .Values.platform.middleware.migrations.limits .Values.platform.middleware.migrations.requests }}
          resources:
            {{- with .Values.platform.middleware.migrations.limits }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.platform.middleware.migrations.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "limina.fullname" . }}-middleware
                optional: true
            - configMapRef:
                name: {{ include "limina.fullname" . }}-platform
            - secretRef:
                name: {{ include "limina.fullname" . }}-platform
      containers:
        - name: {{ include "limina.fullname" . }}-middleware
          image: {{ include "limina.image" (dict "image" .Values.platform.middleware.deployment.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.platform.middleware.deployment.image.pullPolicy }}
          {{- if or .Values.platform.middleware.deployment.limits .Values.platform.middleware.deployment.requests }}
          resources:
            {{- with .Values.platform.middleware.deployment.limits }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.platform.middleware.deployment.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.platform.middleware.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "limina.fullname" . }}-middleware
                optional: true
            - configMapRef:
                name: {{ include "limina.fullname" . }}-platform
            - secretRef:
                name: {{ include "limina.fullname" . }}-platform
          volumeMounts:
            - name: platform-filestore
              mountPath: {{ .Values.platform.shared.mountPath }}
              {{- with .Values.platform.middleware.deployment.additionalMounts.volumeMounts }}
                {{- toYaml . | nindent 12 }}
              {{- end }}
          {{- with .Values.platform.middleware.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.platform.middleware.deployment.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.platform.middleware.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: platform-filestore
          persistentVolumeClaim:
            claimName: {{ include "limina.platform.claimName" . }}
          {{- with .Values.platform.middleware.deployment.additionalMounts.volumes }}
            {{- toYaml . | nindent 8 }}
          {{- end }}
      {{- if or .Values.platform.middleware.deployment.nodeAffinity .Values.platform.middleware.deployment.podAntiAffinity }}
      affinity:
        {{- with .Values.platform.middleware.deployment.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.platform.middleware.deployment.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.platform.middleware.deployment.topologySpreadConstraints.values }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.platform.middleware.deployment.tolerations.values }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
