{{- if and .Values.externalSecrets.platform.enabled .Values.platform.shared.enabled }}
{{- $remoteRefKey := .Values.externalSecrets.platform.shared.env.remoteRefKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "limina.fullname" . }}-platform
  namespace: {{ .Release.Namespace }}
  {{- with .Values.externalSecrets.platform.shared.env.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  refreshInterval: {{ .Values.externalSecrets.platform.shared.env.refreshInterval }}
  target:
    name: {{ include "limina.fullname" . }}-platform
  {{- with .Values.externalSecrets.platform.shared.env.properties }}
  data:
    {{- range . }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRefKey | default $remoteRefKey | quote }}
        property: {{ .property | default .secretKey }}
    {{- end }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ $remoteRefKey }}
  {{- end }}
{{- end }}
