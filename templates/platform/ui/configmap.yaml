{{- if .Values.platform.shared.enabled }}
{{- $data := dict "MIDDLEWARE_URL" (printf "http://%s-middleware:%v" (include "limina.fullname" .) .Values.platform.middleware.service.port) }}
{{- range .Values.platform.ui.configmap.data }}
{{- $_ := set $data .name .value }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "limina.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
data:
{{- range $name, $value := $data }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- end }}
