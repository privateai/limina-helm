{{- if and (not .Values.externalSecrets.platform.enabled) .Values.platform.shared.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "limina.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  {{- with .Values.platform.ui.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
data:
{{- range .Values.platform.ui.secrets.data }}
  {{ .name }}: {{ .value | toString | b64enc }}
{{- end }}
{{- end }}
