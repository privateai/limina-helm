{{- if and .Values.externalSecrets.platform.enabled .Values.externalSecrets.platform.ui.tls.enabled .Values.platform.shared.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "limina.fullname" . }}-tls-ui
  namespace: {{ .Release.Namespace }}
  {{- with .Values.externalSecrets.platform.ui.tls.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  refreshInterval: {{ .Values.externalSecrets.platform.ui.tls.refreshInterval }}
  target:
    name: {{ .Values.platform.ui.ingress.tlsSecretName }}
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ `{{ .tlsSecret | pkcs12cert }}` }}"
        tls.key: "{{ `{{ .tlsSecret | pkcs12key }}` }}"
  data:
    - secretKey: tlsSecret
      remoteRef:
        key: {{ .Values.externalSecrets.platform.ui.tls.remoteRefKey }}
{{- end }}
