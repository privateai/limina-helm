{{- if and .Values.async.shared.enabled .Values.async.processor.configmap.data }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "limina.fullname" . }}-processor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
data:
{{- range .Values.async.processor.configmap.data }}
  {{ .name }}: {{ .value | quote }}
{{- end }}
{{- end }}
