{{ if .Values.async.shared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "limina.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.async.api.deployment.replicaCount }}
  selector:
    {{- with .Values.async.api.deployment.selector.matchLabels }}
    matchLabels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  strategy:
    type: {{ .Values.async.api.deployment.strategy.type }}
  template:
    metadata:
      {{- with .Values.async.api.deployment.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.async.api.deployment.selector.matchLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name }}
      {{- with .Values.async.api.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "limina.fullname" . }}-api
          image: {{ include "limina.image" (dict "image" .Values.async.api.deployment.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.async.api.deployment.image.pullPolicy }}
          {{- if or .Values.async.api.deployment.limits .Values.async.api.deployment.requests }}
          resources:
            {{- with .Values.async.api.deployment.limits }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.async.api.deployment.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.async.api.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "limina.fullname" . }}-api
                optional: true
            - configMapRef:
                name: {{ include "limina.fullname" . }}-shared
            - secretRef:
                name: {{ include "limina.fullname" . }}-shared
          volumeMounts:
            - name: shared-filestore
              mountPath: {{ .Values.async.shared.mountPath }}
              {{- with .Values.async.api.deployment.additionalMounts.volumeMounts }}
                {{- toYaml . | nindent 12 }}
              {{- end }}
          {{- with .Values.async.api.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.async.api.deployment.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.async.api.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: shared-filestore
          persistentVolumeClaim:
            claimName: {{ include "limina.fullname" . }}-async
          {{- with .Values.async.api.deployment.additionalMounts.volumes }}
            {{- toYaml . | nindent 8 }}
          {{- end }}
      {{- if or .Values.async.api.deployment.nodeAffinity .Values.async.api.deployment.podAntiAffinity }}
      affinity:
        {{- with .Values.async.api.deployment.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.async.api.deployment.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.async.api.deployment.topologySpreadConstraints.values }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.async.api.deployment.tolerations.values }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
