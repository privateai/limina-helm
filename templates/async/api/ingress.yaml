{{- if and .Values.api.ingress.enabled .Values.shared.async.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "limina.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.api.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "limina.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
            path: "/"
            pathType: "Prefix"
  tls:
    - hosts:
      - {{ .Values.api.ingress.host }}
      secretName: {{ .Values.api.ingress.tlsSecretName }}
{{- end }}
