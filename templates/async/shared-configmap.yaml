{{- if .Values.async.shared.enabled }}
{{- $data := dict "FILE_DIR" .Values.async.shared.mountPath }}
{{- range .Values.async.shared.configmap.data }}
{{- $_ := set $data .name .value }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "limina.fullname" . }}-shared
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
data:
{{- range $name, $value := $data }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- end }}
