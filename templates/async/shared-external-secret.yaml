{{- if and .Values.externalSecrets.enabled .Values.shared.async.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "limina.fullname" . }}-shared
  namespace: {{ .Release.Namespace }}
  {{- with .Values.externalSecrets.shared.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  refreshInterval: {{ .Values.externalSecrets.shared.refreshInterval }}
  target:
    name: {{ include "limina.fullname" . }}-shared
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.shared.remoteRefKey }}
{{- end }}
