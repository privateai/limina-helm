{{ if .Values.shared.async.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.shared.pvc.name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.shared.pvc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.shared.pvc.accessModes }}
  storageClassName: {{ .Values.shared.storageClass.name }}
  resources:
    requests:
      storage: {{ .Values.shared.pvc.storage }}
{{- end }}
