{{- if and .Values.externalSecrets.secretStore.create (include "limina.externalSecretsEnabled" .) }}
{{- if not .Values.externalSecrets.secretStore.provider }}
{{- fail "externalSecrets.secretStore.provider must be set when externalSecrets.secretStore.create is true" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.externalSecrets.secretStore.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
spec:
  provider:
    {{- include "limina.secretStore.provider" . | nindent 4 }}
{{- end }}
