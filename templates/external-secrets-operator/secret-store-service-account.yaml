{{- if and .Values.externalSecrets.secretStore.create .Values.externalSecrets.secretStore.serviceAccount.create (include "limina.externalSecretsEnabled" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "limina.secretStore.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.externalSecrets.secretStore.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
{{- end }}
