{{- if .Values.core.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ include 'limina.fullname' . }}-core"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
  {{- with .Values.core.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.core.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.core.ingress.host }}
      http:
        paths:
          - backend:
              service:
                name: "{{ include 'limina.fullname' . }}-core"
                port:
                  number: {{ .Values.core.service.port }}
            path: "/"
            pathType: "Prefix"
  tls:
    - hosts:
      - {{ .Values.core.ingress.host }}
      secretName: {{ .Values.core.ingress.tlsSecretName }}
{{- end }}
