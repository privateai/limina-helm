{{- if .Values.core.configmap.data }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "limina.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
data:
{{- range .Values.core.configmap.data }}
  {{ .name }}: {{ .value | b64enc }}
{{- end }}
{{- end }}
