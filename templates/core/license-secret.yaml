{{- if not .Values.externalSecrets.core.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.core.license.name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.core.license.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "limina.labels" . | nindent 4 }}
data:
  license.json: |-
{{- .Values.core.license.data | b64enc | nindent 4 }}
{{- end }}
