      # nodeAffinity:
      #   preferredDuringSchedulingIgnoredDuringExecution:
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina"
      #       weight: 1
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina-spot"
      #       weight: 100

      # Optional configuration for ui product anti affinity
      podAntiAffinity: {}
      # Example podAntiAffinity:
      # podAntiAffinity:
      #   requiredDuringSchedulingIgnoredDuringExecution:
      #     - topologyKey: "kubernetes.io/hostname"
      #       labelSelector:
      #         matchExpressions:
      #           - key: "app"
      #             operator: "In"
      #             values:
      #               - "limina-ui"

      topologySpreadConstraints:
        values: []
        # Use the following if you would like to spread your pods evenly across your infrastructure zones
        # values:
        #   - labelSelector:
        #       matchLabels:
        #         app: "limina-ui"
        #     matchLabelKeys:
        #       - "pod-template-hash"
        #     maxSkew: 1
