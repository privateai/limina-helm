      #       mountPath: "/mount/path"
      #   volumes:
      #     - name: "mount-name"
      #       secret:
      #         secretName: "mount-secret"

      # These are the values for liveness, startup and readiness probes
      # https://kubernetes.io/docs/concepts/workloads/pods/probes/
      # livenessProbe: {}
      # startupProbe: {}
      # Example readinessProbe
      readinessProbe:
        httpGet:
          path: "/healthz"
          port: http
          scheme: "HTTP"
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 1

      # Configuration for node affinity
      # https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
      nodeAffinity: {}
      # Use the following to example to attempt to schedule nodes first on nodes with the label "limina-spot"
