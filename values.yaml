      #   alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:region:111122223333:certificate/certificate-id"
      #   alb.ingress.kubernetes.io/healthcheck-path: "/healthz"
      # Provision selfsigned certificates by default via cert-manager. Change if you wish to customize
      selfsigned: true
      # Replace this with the domain name for the ingress
      host: "platform.ingress.domain.com"
      tlsSecretName: "limina-ui-tls"

    # Configuration related to the ui deployment
    deployment:
      replicaCount: 1

      # Specify selector matchLabels for ui
      selector:
        matchLabels:
          app: "limina-ui"

      # Specify a deployment strategy
      strategy:
        type: "RollingUpdate"

      # Add custom pod annotations to the ui deployment
      podAnnotations: {}
      # Example annotations
      # podAnnotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value1"

      # Specify a node selector to deploy limina ui
      nodeSelector: {}
      # nodeSelector:
      #   container: "limina-platform"

      image:
        # Optionally override the top level repository for this image
        repository: ""
        name: "limina-ui"
        pullPolicy: "IfNotPresent"
        # It is recommended to pin to a specific version for production environments
        tag: "0.36.0"

      # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits
      limits: {}
      # Use the following if you would like to add limits to the ui product
      # limits:
      #   memory: "400Mi"
      #   cpu: "1"

      requests: {}
      # Use the following if you would like to add requests to the ui product
      # requests:
      #   memory: "100Mi"
      #   cpu: "250m"

      # Add custom additional mounts
      additionalMounts: {}
      # Example mount configuration from a secret
      # additionalMounts:
