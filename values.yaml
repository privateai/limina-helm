# Select a cloud provider. Must be one of "Azure", "AWS", or "Other"
cloudProvider: "AWS"

# Override the default name of the application, used in the helper script to populate things like selector labels
nameOverride: ""

# Override the full name of the application
fullnameOverride: ""

# Limina image repository, used by every product unless overridden in a component's image.repository
repository: "crprivateaiprod.azurecr.io"

# This secret will store your docker pull credentials. You can obtain these from the customer portal
# If you enable externalSecrets.dockerCredential, this section will be ignored
imagePullSecrets:
  name: "crprivateaiprod-creds"

# This section contains all information related to the Limina core product
core:
  # Settings for the Limina license file
  license:
    # If you enable externalSecrets.core, this section will be ignored
    # Sets the name of the license secret object
    name: "limina-license"

    # Add optional annotations for the license secret. For more details see https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    annotations: {}
    # Example annotations
    # annotations:
    #   annotation-key1: "annotation-value1"
    #   annotation-key2: "annotation-value2"

    # Specify license volume mount for all products
    volumeMount: "license-volume"
    # If you enable externalSecrets.core, you can ignore this setting as the license file will be populated via a secret
    # Override with your license data. See readme for more details
    data: '{"id": "1", "tier": "..."}'

  # Enter any environment variables for your deployment. You can find the list at https://docs.getlimina.ai/configuration-and-operations/container-management/environment-variables
  configmap:
    data: []
    # Example environment variables:
    # data:
    #   - name: "PAI_DISABLE_RAM_CHECK"
    #     value: "true"

  # These secrets will be added to the environment variables for the Limina core deployment
  # If you enable externalSecrets.core, this section will be ignored
  secrets:
    # Add optional annotations for the deployment secret. For more details see https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    annotations: {}
    # Example annotations
    # annotations:
    #   annotation-key1: "annotation-value1"
    #   annotation-key2: "annotation-value2"

    # If you enable externalSecrets.core, you can ignore this section and populate via externalSecrets.core.env
    data: []
    # Enter any environment variables for your deployment you wish to remain secret. Example: https://docs.getlimina.ai/configuration-and-operations/advanced-features/azure-ocr
    # data:
    #   - name: "PAI_AZ_COMPUTER_VISION_KEY"
    #     value: "keyvalue"

  # Configuration related to the core service
  service:
    # Add custom annotations to the service
    annotations: {}
    # Set the Azure load balancer to be internal only, if you are planning to use an ingress to manage traffic with service type of LoadBalancer
    # annotations:
    #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    # Set the AWS load balancer to be internal only, if you are planning to use an ingress to manage traffic with service type of LoadBalancer
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-internal: "true"

    # Set the type for the service
    type: "ClusterIP"

    # Set the port for the service
    port: 80

    # Set the target port for the deployment
    targetPort: 8080

  # Configuration for a kubernetes ingress for the core product
  # Requires haproxy-ingress and cert-manager to be installed
  ingress:
    # Enable or disable the ingress configuration
    enabled: false
    # Set the class to handle the ingress traffic. Default to haproxy
    ingressClassName: "haproxy"
    # Set your own custom annotations, see https://www.haproxy.com/documentation/kubernetes-ingress/community/configuration-reference/ingress/
    annotations: {}
    # Example to rate limit to 15 requests per minute
    # annotations:
    #   haproxy.org/rate-limit-requests: 15
    #   haproxy.org/rate-limit-period: "1m"
    # Provision selfsigned certificates by default via cert-manager. Change if you wish to customize
    selfsigned: true
    # Replace this with the domain name for the ingress
    host: "core.ingress.domain.com"
    tlsSecretName: "limina-core-tls"

  # Configuration related to the core deployment
  deployment:
    # Sets the number of replicas for the Limina deployment
    replicaCount: 1

    # Configuration for the GPU
    # Ensure you update the image to a -gpu or -gpu-text flavour
    gpu: {}
    # Example gpu settings
    # gpu:
    #   sizeLimit: "4Gi"
    #   limits:
    #     nvidia.com/gpu: 1
    #   tolerations:
    #     values:
    #       - key: "dedicated"
    #         operator: "Equal"
    #         value: "gpu"
    #         effect: "NoSchedule"

    # Specify selector matchLabels for core
    selector:
      matchLabels:
        app: "limina-core"

    # Specify a deployment strategy
    strategy:
      type: "RollingUpdate"

    # Add custom pod annotations to the deployment
    podAnnotations: {}
    # Example annotations
    # podAnnotations:
    #   annotation-key1: "annotation-value1"
    #   annotation-key2: "annotation-value1"

    # Recommended to create a specific node to run limina core, and add the label container=limina-core
    nodeSelector:
      container: "limina-core"

    image:
      # Optionally override the top level repository for this image
      repository: ""
      name: "deid"
      pullPolicy: "IfNotPresent"
      # Can be a direct version tag / container flavour (i.e. 4.0.4-cpu-text) OR a 'latest' tag (i.e. cpu, cpu-text, gpu, gpu-text)
      # It is recommended to pin to a specific version for production environments
      # If using -gpu or -gpu-text, ensure you complete the section core.deployment.gpu with the appropriate settings
      tag: "4.5.2-cpu"

    # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits
    limits: {}
    # Use the following if you would like to add limits to the core product
    # limits:
    #   memory: "12Gi"
    #   cpu: "4"

    requests: {}
    # Use the following if you would like to add requests to the core product
    # requests:
    #   memory: "8Gi"
    #   cpu: "3"

    # Add custom additional mounts
    additionalMounts: {}
    # Example mount configuration from a secret
    # additionalMounts:
    #   volumeMounts:
    #     - name: "mount-name"
    #       mountPath: "/mount/path"
    #   volumes:
    #     - name: "mount-name"
    #       secret:
    #         secretName: "mount-secret"

    # These are the values for liveness, startup and readiness probes
    # https://kubernetes.io/docs/concepts/workloads/pods/probes/
    livenessProbe: {}
    # Example livenessProbe. This is not recommended as it may cause pod instability
    # livenessProbe:
    #   httpGet:
    #     path: "/healthz"
    #     port: http
    #     scheme: "HTTP"
    #   initialDelaySeconds: 60
    #   periodSeconds: 60
    #   failureThreshold: 30
    #   timeoutSeconds: 1
    startupProbe:
      # Note: You should expect to see warnings for startup probe failures in the pod events until the container starts
      httpGet:
        path: "/healthz"
        port: http
        scheme: "HTTP"
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 23
      timeoutSeconds: 1
    readinessProbe:
      httpGet:
        path: "/healthz"
        port: http
        scheme: "HTTP"
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 1

    # Configuration for node affinity
    # https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
    nodeAffinity: {}
    # Use the following to example to attempt to schedule nodes first on nodes with the label "limina-spot"
    # and after on nodes with the label "limina"
    # nodeAffinity:
    #   preferredDuringSchedulingIgnoredDuringExecution:
    #     - preference:
    #         matchExpressions:
    #           - key: "nodetype"
    #             operator: "In"
    #             values:
    #               - "limina"
    #       weight: 1
    #     - preference:
    #         matchExpressions:
    #           - key: "nodetype"
    #             operator: "In"
    #             values:
    #               - "limina-spot"
    #       weight: 100

    # Recommended configuration to ensure only one Limina core container is scheduled per node
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: "kubernetes.io/hostname"
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: "In"
                values:
                  - "limina-core"

    topologySpreadConstraints:
      values: []
      # Use the following if you would like to spread your pods evenly across your infrastructure zones
      # values:
      #   - labelSelector:
      #       matchLabels:
      #         app.kubernetes.io/name: "limina"
      #         app.kubernetes.io/instance: "limina"
      #     matchLabelKeys:
      #       - "pod-template-hash"
      #     maxSkew: 1
      #     topologyKey: "topology.kubernetes.io/zone"
      #     whenUnsatisfiable: "ScheduleAnyway"

    tolerations:
      values: []
      # Use the following if you have added a taint to your nodes of app=limina
      # values:
      #   - key: app
      #     operator: "Equal"
      #     value: "limina-core"
      #     effect: "NoSchedule"

# This section contains all information related to the Limina async file support products
async:
  # Configuration shared by the async api, custodian and processor
  shared:
    # Enable or disable the async file support, defaults to false
    # If enabled, you must also configure the api, custodian and processor sections
    enabled: false

    # Specify the mount path of the shared file store for the api, custodian and processor
    # This is passed to the containers as the FILE_DIR environment variable
    mountPath: "/mnt/afp-files"

    # Configmap data shared by the api, custodian and processor, including Redis connection settings and optional timeouts
    # FILE_DIR is set automatically from mountPath, but can be overridden here
    configmap:
      data:
        - name: "REDIS_HOST"
          value: "redis-url"
        - name: "REDIS_PORT"
          value: 6380
        - name: "REDIS_ENABLE_SSL"
          value: "true"
        # - name: "STATE_TTL_SUBMITTED"
        #   value: 43200 # 12 hours
        # - name: "STATE_TTL_IN_PROGRESS"
        #   value: 43200 # 12 hours
        # - name: "STATE_TTL_COMPLETED"
        #   value: 3600 # 1 hour
        # - name: "STATE_TTL_DOWNLOADED"
        #   value: 600 # 10 minutes
        # - name: "STATE_TTL_FAILED"
        #   value: 3600 # 1 hour
        # - name: "STATE_TTL_EXPIRED"
        #   value: 3600 # 1 hour
        # - name: "STATE_TTL_CANCELLED"
        #   value: 3600 # 1 hour

    # Optional shared secret, required if the async product is enabled
    # If you enable externalSecrets.async, this section will be ignored
    secrets:
      # Add optional annotations for the shared secret. For more details see https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"

      # If you enable externalSecrets.async this section will be ignored
      data: []
      # data:
      #   - name: "REDIS_KEY"
      #     value: ""

    # Optional persistent volume claim settings required for async support. Leave defaults if not running async
    pvc:
      # Add optional annotations for the pvc
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"

      # Specify the access mode for the persistent volume claim
      accessModes: "ReadWriteMany"

      # Set the size of the requested persistent volume claim
      storage: "200Gi"

    # Optional storage class settings required for async support. Leave defaults if not running async
    storageClass:
      # Add optional annotations for the storage class
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"

      # Example for AWS using EFS
      provisioner: "efs.csi.aws.com"
      parameters:
        provisioningMode: "efs-ap"
        fileSystemId: "insert your pre-made efs file system id"
        directoryPerms: "700"
      volumeBindingMode: "WaitForFirstConsumer"

      # Example for Azure using file storage
      # provisioner: "file.csi.azure.com"
      # mountOptions:
      #   - dir_mode=0777
      #   - file_mode=0777
      #   - uid=0
      #   - gid=0
      #   - mfsymlinks
      #   - cache=strict
      # parameters:
      #   skuName: "Standard_LRS"
      #   shareName: "limina-async-files"

  # This section contains all information related to the Limina async api product
  # This is disabled by default, and only required if you set async.shared.enabled to true
  api:
    # Update environment variables to customize your deployment
    configmap:
      data: []
      # data:
      #   - name: "LOG_LEVEL"
      #     value: "info"
      #   - name: "INTERVAL_SECONDS_PUB_JOB_EXPIRE"
      #     value: 300

    # Configuration related to the api service
    service:
      # Add custom annotations to the service
      annotations: {}
      # Set the Azure load balancer to be internal only, if you are planning to use an ingress to manage traffic with service type of LoadBalancer
      # annotations:
      #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      # Set the AWS load balancer to be internal only, if you are planning to use an ingress to manage traffic with service type of LoadBalancer
      # annotations:
      #   service.beta.kubernetes.io/aws-load-balancer-internal: "true"

      # Set the type for the service
      type: "ClusterIP"

      # Set the port for the service
      port: 80

      # Set the target port for the deployment
      targetPort: 80

    # Configuration for a kubernetes ingress for the api product
    # Requires haproxy-ingress and cert-manager to be installed
    ingress:
      # Enable or disable the ingress configuration
      enabled: false
      # Set the class to handle the ingress traffic. Default to haproxy
      ingressClassName: "haproxy"
      # Set your own custom annotations, see https://www.haproxy.com/documentation/kubernetes-ingress/community/configuration-reference/ingress/
      annotations: {}
      # Example to rate limit to 15 requests per minute
      # annotations:
      #   haproxy.org/rate-limit-requests: 15
      #   haproxy.org/rate-limit-period: "1m"
      # Provision selfsigned certificates by default via cert-manager. Change if you wish to customize
      selfsigned: true
      # Replace this with the domain name for the ingress
      host: "api.ingress.domain.com"
      tlsSecretName: "limina-api-tls"

    # Configuration related to the api deployment
    deployment:
      replicaCount: 1

      # Specify selector matchLabels for api
      selector:
        matchLabels:
          app: "limina-api"

      # Specify a deployment strategy
      strategy:
        type: "RollingUpdate"

      # Add custom pod annotations to the api deployment
      podAnnotations: {}
      # Example annotations
      # podAnnotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value1"

      # Specify a node selector to deploy limina api
      nodeSelector: {}
      # nodeSelector:
      #   container: "limina-api"

      image:
        # Optionally override the top level repository for this image
        repository: ""
        name: "afp-api"
        pullPolicy: "IfNotPresent"
        # It is recommended to pin to a specific version for production environments
        tag: "0.10.4"

      # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits
      limits: {}
      # Use the following if you would like to add limits to the api product
      # limits:
      #   memory: "4Gi"
      #   cpu: "2"

      requests: {}
      # Use the following if you would like to add requests to the api product
      # requests:
      #   memory: "2Gi"
      #   cpu: "1"

      # Add custom additional mounts
      additionalMounts: {}
      # Example mount configuration from a secret
      # additionalMounts:
      #   volumeMounts:
      #     - name: "mount-name"
      #       mountPath: "/mount/path"
      #   volumes:
      #     - name: "mount-name"
      #       secret:
      #         secretName: "mount-secret"

      # These are the values for liveness, startup and readiness probes
      # https://kubernetes.io/docs/concepts/workloads/pods/probes/
      # livenessProbe: {}
      # Example livenessProbe. This is not recommended as it may cause pod instability
      # livenessProbe:
      #   httpGet:
      #     path: "/healthz"
      #     port: http
      #     scheme: "HTTP"
      #   initialDelaySeconds: 5
      #   periodSeconds: 60
      #   failureThreshold: 5
      #   timeoutSeconds: 1
      startupProbe:
        # Note: You should expect to see warnings for startup probe failures in the pod events until the container starts
        httpGet:
          path: "/healthz"
          port: http
          scheme: "HTTP"
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 23
        timeoutSeconds: 1
      readinessProbe:
        httpGet:
          path: "/healthz"
          port: http
          scheme: "HTTP"
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 1

      # Configuration for node affinity
      # https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
      nodeAffinity: {}
      # Use the following to example to attempt to schedule nodes first on nodes with the label "limina-spot"
      # and after on nodes with the label "limina"
      # nodeAffinity:
      #   preferredDuringSchedulingIgnoredDuringExecution:
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina"
      #       weight: 1
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina-spot"
      #       weight: 100

      # Optional configuration for api product anti affinity
      podAntiAffinity: {}
      # Example podAntiAffinity:
      # podAntiAffinity:
      #   requiredDuringSchedulingIgnoredDuringExecution:
      #     - topologyKey: "kubernetes.io/hostname"
      #       labelSelector:
      #         matchExpressions:
      #           - key: "app"
      #             operator: "In"
      #             values:
      #               - "limina-api"

      topologySpreadConstraints:
        values: []
        # Use the following if you would like to spread your pods evenly across your infrastructure zones
        # values:
        #   - labelSelector:
        #       matchLabels:
        #         app.kubernetes.io/name: "limina"
        #         app.kubernetes.io/instance: "limina"
        #     matchLabelKeys:
        #       - "pod-template-hash"
        #     maxSkew: 1
        #     topologyKey: "topology.kubernetes.io/zone"
        #     whenUnsatisfiable: "ScheduleAnyway"

      tolerations:
        values: []
        # Use the following if you have added a taint to your nodes of app=limina
        # values:
        #   - key: app
        #     operator: "Equal"
        #     value: "limina"
        #     effect: "NoSchedule"

  # This section contains all information related to the Limina custodian product
  # This is disabled by default, and only required if you set async.shared.enabled to true
  custodian:
    # Update environment variables to customize your deployment
    configmap:
      data:
        - name: "WORKER_ROLE"
          value: "custodian"

    # Configuration related to the custodian deployment
    deployment:
      replicaCount: 1

      # Specify selector matchLabels for custodian
      selector:
        matchLabels:
          app: "limina-custodian"

      # Specify a deployment strategy
      strategy:
        type: "RollingUpdate"

      # Add custom pod annotations to the custodian deployment
      podAnnotations: {}
      # Example annotations
      # podAnnotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value1"

      # Specify a node selector to deploy limina custodian
      nodeSelector: {}
      # nodeSelector:
      #   container: "limina-custodian"

      image:
        # Optionally override the top level repository for this image
        repository: ""
        name: "afp-worker"
        pullPolicy: "IfNotPresent"
        # It is recommended to pin to a specific version for production environments
        tag: "0.10.4"

      # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits
      limits: {}
      # Use the following if you would like to add limits to the custodian product
      # limits:
      #   memory: "4Gi"
      #   cpu: "2"

      requests: {}
      # Use the following if you would like to add requests to the custodian product
      # requests:
      #   memory: "2Gi"
      #   cpu: "1"

      # Add custom additional mounts
      additionalMounts: {}
      # Example mount configuration from a secret
      # additionalMounts:
      #   volumeMounts:
      #     - name: "mount-name"
      #       mountPath: "/mount/path"
      #   volumes:
      #     - name: "mount-name"
      #       secret:
      #         secretName: "mount-secret"

      # Configuration for node affinity
      # https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
      nodeAffinity: {}
      # Use the following to example to attempt to schedule nodes first on nodes with the label "limina-spot"
      # and after on nodes with the label "limina"
      # nodeAffinity:
      #   preferredDuringSchedulingIgnoredDuringExecution:
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina"
      #       weight: 1
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina-spot"
      #       weight: 100

      # Optional configuration for custodian product anti affinity
      podAntiAffinity: {}
      # Example configuration for pod anti affinity:
      # podAntiAffinity:
      #   requiredDuringSchedulingIgnoredDuringExecution:
      #     - topologyKey: "kubernetes.io/hostname"
      #       labelSelector:
      #         matchExpressions:
      #           - key: "app"
      #             operator: "In"
      #             values:
      #               - "limina-custodian"

      topologySpreadConstraints:
        values: []
        # Use the following if you would like to spread your pods evenly across your infrastructure zones
        # values:
        #   - labelSelector:
        #       matchLabels:
        #         app.kubernetes.io/name: "limina"
        #         app.kubernetes.io/instance: "limina"
        #     matchLabelKeys:
        #       - "pod-template-hash"
        #     maxSkew: 1
        #     topologyKey: "topology.kubernetes.io/zone"
        #     whenUnsatisfiable: "ScheduleAnyway"

      tolerations:
        values: []
        # Use the following if you have added a taint to your nodes of app=limina
        # values:
        #   - key: app
        #     operator: "Equal"
        #     value: "limina"
        #     effect: "NoSchedule"

  # This section contains all information related to the Limina processor product
  # This is disabled by default, and only required if you set async.shared.enabled to true
  processor:
    # Update environment variables to customize your deployment
    configmap:
      data:
        - name: "WORKER_ROLE"
          value: "processor"
        - name: "DEID_URL"
          value: "http://localhost:8080"
        # - name: "LOG_LEVEL"
        #   value: "info"
        # - name: "REQUEST_TIMEOUT"
        #   value: 300

    # Configuration related to the processor container, which runs alongside the core container in the core deployment
    deployment:
      image:
        # Optionally override the top level repository for this image
        repository: ""
        name: "afp-worker"
        pullPolicy: "IfNotPresent"
        # It is recommended to pin to a specific version for production environments
        tag: "0.10.4"

      # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits
      limits: {}
      # Use the following if you would like to add limits to the processor container
      # limits:
      #   memory: "4Gi"
      #   cpu: "2"

      requests: {}
      # Use the following if you would like to add requests to the processor container
      # requests:
      #   memory: "2Gi"
      #   cpu: "1"

# This section contains all information related to the Limina Platform products
platform:
  # Configuration shared by the middleware, worker and ui
  shared:
    # Enable or disable the Limina Platform, defaults to false
    enabled: false

    # Specify the mount path of the shared file store for the middleware and worker
    # This is passed to the containers as the STORAGE_PATH environment variable
    mountPath: "/mnt/limina-filestore"

    # Optional service account used by the middleware, worker and ui pods
    # Use this to grant cloud permissions to the platform, e.g. IAM Roles for Service Accounts (IRSA) on AWS or Workload Identity on Azure
    serviceAccount:
      # Create a service account for the platform pods
      create: false
      # Name of the service account
      # If create is true and this is empty, defaults to <fullname>-platform
      # If create is false, set this to use an existing service account, or leave empty to use the namespace default service account
      name: ""
      # Add optional annotations for the service account
      annotations: {}
      # Example annotation for AWS IRSA
      # annotations:
      #   eks.amazonaws.com/role-arn: "arn:aws:iam::111122223333:role/limina-platform"
      # Example annotation for Azure Workload Identity
      # annotations:
      #   azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"

    # Configmap data shared by the middleware and worker
    # LIMINA_CORE_URL and STORAGE_PATH are set automatically from this chart, but can be overridden here
    configmap:
      data:
        - name: "REDIS_HOST"
          value: "redis-url"
        - name: "REDIS_PORT"
          value: 6379
        - name: "REDIS_SSL"
          value: "true"
        - name: "POSTGRES_HOST"
          value: "postgres-url"
        - name: "POSTGRES_PORT"
          value: 5432
        - name: "POSTGRES_DB"
          value: "platform"
        # - name: "LOG_LEVEL"
        #   value: "INFO"
        # - name: "LIMINA_CORE_REQUEST_TIMEOUT"
        #   value: 3600
        # - name: "STATE_EX_SUBMITTED"
        #   value: 43200 # 12 hours
        # - name: "STATE_EX_COMPLETED"
        #   value: 3600 # 1 hour
        # - name: "EXPORT_TTL_SECONDS"
        #   value: 432000 # 5 days

    # Secrets shared by the middleware and worker, added to their environment variables
    # If you enable externalSecrets.platform, this section will be ignored
    secrets:
      # Add optional annotations for the platform secret. For more details see https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"

      # If you enable externalSecrets.platform this section will be ignored
      data: []
      # data:
      #   - name: "REDIS_PASSWORD"
      #     value: ""
      #   - name: "POSTGRES_USER"
      #     value: ""
      #   - name: "POSTGRES_PASSWORD"
      #     value: ""

    # Persistent volume claim settings for the shared platform file store
    pvc:
      # Add optional annotations for the pvc
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"

      # Specify the access mode for the persistent volume claim
      accessModes: "ReadWriteMany"

      # Set the size of the requested persistent volume claim
      storage: "100Gi"

    # Storage class settings for the shared platform file store
    storageClass:
      # Add optional annotations for the storage class
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"

      # Example for AWS using EFS
      provisioner: "efs.csi.aws.com"
      parameters:
        provisioningMode: "efs-ap"
        fileSystemId: "insert your pre-made efs file system id"
        directoryPerms: "700"
        uid: "1000"
        gid: "1000"
      volumeBindingMode: "WaitForFirstConsumer"
      # Set to "Retain" to keep the underlying files when the pvc is deleted
      reclaimPolicy: "Retain"

      # Example for Azure using file storage
      # provisioner: "file.csi.azure.com"
      # mountOptions:
      #   - dir_mode=0777
      #   - file_mode=0777
      #   - uid=1000
      #   - gid=1000
      #   - mfsymlinks
      #   - cache=strict
      # parameters:
      #   skuName: "Standard_LRS"
      #   shareName: "limina-platform-files"

  # This section contains all information related to the Limina Platform middleware product
  # This is disabled by default, and only required if you set platform.shared.enabled to true
  middleware:
    # Update environment variables to customize your deployment
    configmap:
      data: []
      # data:
      #   - name: "LOG_LEVEL_MIDDLEWARE"
      #     value: "INFO"
      #   - name: "AUTH_PROVIDERS"
      #     value: '[{"name": "google", "issuer": "https://accounts.google.com", "audience": "your-google-client-id"}]'

    # Database migrations, run as an init container before the middleware starts
    migrations:
      # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits
      limits: {}
      # Use the following if you would like to add limits to the migrations container
      # limits:
      #   memory: "200Mi"
      #   cpu: "200m"

      requests: {}
      # Use the following if you would like to add requests to the migrations container
      # requests:
      #   memory: "100Mi"
      #   cpu: "100m"

    # Configuration related to the middleware service
    service:
      # Add custom annotations to the service
      annotations: {}

      # Set the type for the service
      type: "ClusterIP"

      # Set the port for the service
      port: 80

      # Set the target port for the deployment
      targetPort: 80

    # Configuration related to the middleware deployment
    deployment:
      replicaCount: 1

      # Specify selector matchLabels for middleware
      selector:
        matchLabels:
          app: "limina-middleware"

      # Specify a deployment strategy
      strategy:
        type: "RollingUpdate"

      # Add custom pod annotations to the middleware deployment
      podAnnotations: {}
      # Example annotations
      # podAnnotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value1"

      # Specify a node selector to deploy limina middleware
      nodeSelector: {}
      # nodeSelector:
      #   container: "limina-platform"

      image:
        # Optionally override the top level repository for this image
        repository: ""
        name: "limina-middleware"
        pullPolicy: "IfNotPresent"
        # It is recommended to pin to a specific version for production environments
        tag: "0.36.0"

      # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits
      limits: {}
      # Use the following if you would like to add limits to the middleware product
      # limits:
      #   memory: "200Mi"
      #   cpu: "1"

      requests: {}
      # Use the following if you would like to add requests to the middleware product
      # requests:
      #   memory: "100Mi"
      #   cpu: "100m"

      # Add custom additional mounts
      additionalMounts: {}
      # Example mount configuration from a secret
      # additionalMounts:
      #   volumeMounts:
      #     - name: "mount-name"
      #       mountPath: "/mount/path"
      #   volumes:
      #     - name: "mount-name"
      #       secret:
      #         secretName: "mount-secret"

      # These are the values for liveness, startup and readiness probes
      # https://kubernetes.io/docs/concepts/workloads/pods/probes/
      # livenessProbe: {}
      # startupProbe: {}
      readinessProbe:
        httpGet:
          path: "/healthz"
          port: http
          scheme: "HTTP"
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 1

      # Configuration for node affinity
      # https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/
      nodeAffinity: {}
      # Use the following to example to attempt to schedule nodes first on nodes with the label "limina-spot"
      # and after on nodes with the label "limina"
      # nodeAffinity:
      #   preferredDuringSchedulingIgnoredDuringExecution:
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina"
      #       weight: 1
      #     - preference:
      #         matchExpressions:
      #           - key: "nodetype"
      #             operator: "In"
      #             values:
      #               - "limina-spot"
      #       weight: 100

      # Optional configuration for middleware product anti affinity
      podAntiAffinity: {}
      # Example podAntiAffinity:
      # podAntiAffinity:
      #   requiredDuringSchedulingIgnoredDuringExecution:
      #     - topologyKey: "kubernetes.io/hostname"
      #       labelSelector:
      #         matchExpressions:
      #           - key: "app"
      #             operator: "In"
      #             values:
      #               - "limina-middleware"

      topologySpreadConstraints:
        values: []
        # Use the following if you would like to spread your pods evenly across your infrastructure zones
        # values:
        #   - labelSelector:
        #       matchLabels:
        #         app: "limina-middleware"
        #     matchLabelKeys:
        #       - "pod-template-hash"
        #     maxSkew: 1
        #     topologyKey: "topology.kubernetes.io/zone"
        #     whenUnsatisfiable: "ScheduleAnyway"

      tolerations:
        values: []
        # Use the following if you have added a taint to your nodes of app=limina
        # values:
        #   - key: app
        #     operator: "Equal"
        #     value: "limina"
        #     effect: "NoSchedule"

  # This section contains all information related to the Limina Platform ui product
  # This is disabled by default, and only required if you set platform.shared.enabled to true
  ui:
    # Update environment variables to customize your deployment
    # MIDDLEWARE_URL is set automatically from this chart, but can be overridden here
    configmap:
      data:
        - name: "LIMINA_MODE"
          value: "PLATFORM"
        # Replace this with the external URL users will reach the ui on, usually https://<platform.ui.ingress.host>
        - name: "BETTER_AUTH_URL"
          value: "https://platform.ingress.domain.com"
        # - name: "LOG_LEVEL"
        #   value: "info"

    # These secrets will be added to the environment variables for the Limina ui deployment
