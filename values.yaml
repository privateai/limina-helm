# Configuration for the External Secrets Operator
# Each product (core, async and platform) has its own enabled switch, so you can use the External Secrets Operator for some products and plain kubernetes secrets for others
externalSecrets:
  # Specifies the secret store to retrieve secrets for every product
  secretStoreName: "limina-store"
  # Optionally create the SecretStore named by secretStoreName in the release namespace
  # It is only created when the External Secrets Operator is enabled for at least one product below
  # Leave create as false if you create the SecretStore yourself, as described in the README
  # If a SecretStore with this name already exists in the namespace, delete it or choose a new secretStoreName before setting create to true
  secretStore:
    # Create the SecretStore with this chart
    create: false
    # Optional annotations for the SecretStore object
    annotations: {}
    # Example annotations
    # annotations:
    #   annotation-key1: "annotation-value1"
    #   annotation-key2: "annotation-value2"
    # Service account the SecretStore uses to authenticate to the secret store provider
    # The service account is not used by any pod. Its annotations bind it to a cloud identity, e.g. an IAM role (IRSA) on AWS or a managed identity (Workload Identity) on Azure
    # For the aws provider, the service account is added to provider.aws.auth.jwt.serviceAccountRef unless provider.aws.auth is set
    # For the azurekv provider with authType "WorkloadIdentity", it is added to provider.azurekv.serviceAccountRef unless that is set
    # For any other provider, reference the service account name in the provider configuration yourself
    serviceAccount:
      # Create a service account for the SecretStore in the release namespace
      create: true
      # Name of the service account
      # If create is true and this is empty, defaults to <fullname>-secret-store
      # If create is false, set this to use an existing service account in the release namespace,
      # or leave empty to authenticate with the identity of the External Secrets Operator controller instead
      # The cloud identity must trust this service account, e.g. the IAM role trust policy subject is system:serviceaccount:<namespace>:<name>
      name: ""
      # Annotations for the service account, required to bind it to a cloud identity
      annotations: {}
      # Example annotation for AWS IRSA
      # annotations:
      #   eks.amazonaws.com/role-arn: "arn:aws:iam::111122223333:role/limina-secret-store"
      # Example annotations for Azure Workload Identity
      # annotations:
      #   azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
      #   azure.workload.identity/tenant-id: "00000000-0000-0000-0000-000000000000"
    # The provider configuration of the SecretStore, rendered into spec.provider. Required if create is true
    # See https://external-secrets.io/latest/provider/aws-secrets-manager/ and https://external-secrets.io/latest/provider/azure-key-vault/
    provider: {}
    # Example AWS Secrets Manager provider, authenticating with the IAM role of the service account above
    # provider:
    #   aws:
    #     service: "SecretsManager"
    #     region: "ca-central-1"
    # Example Azure Key Vault provider, authenticating with workload identity through the service account above
    # provider:
    #   azurekv:
    #     authType: "WorkloadIdentity"
    #     vaultUrl: "https://your-key-vault.vault.azure.net/"
  # Configuration details for the docker credentials secret
  dockerCredential:
    # Enables or disables the external secret for the docker credentials
    # If enabled, the imagePullSecrets secret is created by the External Secrets Operator instead of manually
    enabled: false
    # Optional annotations for the docker credential externalsecret and secret objects
    annotations: {}
    # Example annotations
    # annotations:
    #   annotation-key1: "annotation-value1"
    #   annotation-key2: "annotation-value2"
    # Set the refresh interval to check for updated secrets
    refreshInterval: "1h"
    # This is the reference to the name of the secret from the secret store
    # For simplicity, it is assumed that all the credentials are in the same key, in different properties
    remoteRefKey: "limina-docker"
    serverProperty: "server"
    usernameProperty: "username"
    passwordProperty: "password"

  # Configuration for the External Secrets Operator for the core product
  core:
    # Enables or disables the External Secrets Operator for the core product
    # If enabled, core.license and core.secrets are ignored, and are populated from the secret store instead
    enabled: false
    # Configuration details for the license file
    license:
      # Optional annotations for the license externalsecret and secret objects
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"
      # Set the refresh interval to check for updated secrets
      refreshInterval: "1h"
      # This is the reference to the name of the secret from the secret store
      remoteRefKey: "limina-license"
      licenseProperty: "license.json"
    # Configuration for the optional Limina core environment secrets
    env:
      # Enables or disables Limina environment secrets
      enabled: false
      # Optional annotations for the core deployment externalsecret and secret objects
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"
      # Set the refresh interval to check for updated secrets
      refreshInterval: "1h"
      # This is the reference to the name of the secret from the secret store
      # All properties will be added from the secret in the secret store to the container environment variables
      remoteRefKey: "limina-core"
    # Configuration for the Limina core product TLS secret
    tls:
      # Enables or disables external secret for TLS
      enabled: false
      # Optional annotations for the shared externalsecret and secret objects
      annotations: {}
      # Example annotations
      # annotations:
      #   annotation-key1: "annotation-value1"
      #   annotation-key2: "annotation-value2"
      # Set the refresh interval to check for updated secrets
      refreshInterval: "1h"
      # This is the reference to the name of the secret from the secret store
      # All properties will be added from the secret in the secret store to the container environment variables
      remoteRefKey: "limina-core-tls"

  # Configuration for the External Secrets Operator for the async products
  async:
    # Enables or disables the External Secrets Operator for the async products
    # If enabled, async.shared.secrets is ignored, and is populated from the secret store instead
    enabled: false
    # Configuration for the secrets shared by the async products
    shared:
      # Configuration for the shared async secrets, required if async is enabled
      env:
        # Optional annotations for the shared externalsecret and secret objects
        annotations: {}
        # Example annotations
        # annotations:
        #   annotation-key1: "annotation-value1"
        #   annotation-key2: "annotation-value2"
        # Set the refresh interval to check for updated secrets
        refreshInterval: "1h"
        # This is the reference to the name of the secret from the secret store
        # All properties will be added from the secret in the secret store to the container environment variables
        remoteRefKey: "limina-shared"
    # Configuration for the async api product
    api:
      # Configuration for the Limina async api product TLS secret
      tls:
        # Enables or disables external secret for TLS
        enabled: false
        # Optional annotations for the shared externalsecret and secret objects
        annotations: {}
        # Example annotations
        # annotations:
        #   annotation-key1: "annotation-value1"
        #   annotation-key2: "annotation-value2"
        # Set the refresh interval to check for updated secrets
        refreshInterval: "1h"
        # This is the reference to the name of the secret from the secret store
        # All properties will be added from the secret in the secret store to the container environment variables
        remoteRefKey: "limina-api-tls"

  # Configuration for the External Secrets Operator for the platform products
  platform:
    # Enables or disables the External Secrets Operator for the platform products
    # If enabled, platform.shared.secrets and platform.ui.secrets are ignored, and are populated from the secret store instead
    enabled: false
    # Configuration for the secrets shared by the middleware and worker
    shared:
      # Configuration for the shared Limina Platform secrets used by the middleware and worker, required if the platform is enabled
      env:
        # Optional annotations for the platform externalsecret and secret objects
        annotations: {}
        # Example annotations
        # annotations:
        #   annotation-key1: "annotation-value1"
        #   annotation-key2: "annotation-value2"
        # Set the refresh interval to check for updated secrets
        refreshInterval: "1h"
        # This is the reference to the name of the secret from the secret store
        # Used for every property below that does not set its own remoteRefKey
        remoteRefKey: "limina-platform"
        # The properties to pull from the secret store into the middleware and worker environment variables
        # secretKey is the environment variable name, and property is the name of the property in your secret store that holds its value
        # Update each property to match your secret store. If property is not set, it defaults to secretKey
        # Set remoteRefKey on a property to read it from a different secret in the secret store. If not set, it defaults to the remoteRefKey above
        # Set this to [] to add every property from the remoteRefKey secret above instead
        properties:
          - secretKey: "REDIS_PASSWORD"
            property: "REDIS_PASSWORD" # Enter the property containing your redis password
          - secretKey: "POSTGRES_USER"
            property: "username" # Enter the property containing your PostgreSQL user
          - secretKey: "POSTGRES_PASSWORD"
            property: "password" # Enter the property containing your PostgreSQL password
        # Example reading the redis password and the database credentials from separate secrets
        # e.g. the database credentials from the secret that AWS RDS manages for the master user
        # properties:
        #   - secretKey: "REDIS_PASSWORD"
        #     remoteRefKey: "limina-redis"
        #     property: "password"
        #   - secretKey: "POSTGRES_USER"
        #     remoteRefKey: "rds!db-00000000-0000-0000-0000-000000000000"
        #     property: "username"
        #   - secretKey: "POSTGRES_PASSWORD"
        #     remoteRefKey: "rds!db-00000000-0000-0000-0000-000000000000"
        #     property: "password"
    # Configuration for the platform ui product
    ui:
      # Configuration for the Limina Platform ui secrets, required if the platform is enabled
      env:
        # Optional annotations for the ui externalsecret and secret objects
        annotations: {}
        # Example annotations
        # annotations:
        #   annotation-key1: "annotation-value1"
        #   annotation-key2: "annotation-value2"
        # Set the refresh interval to check for updated secrets
        refreshInterval: "1h"
        # This is the reference to the name of the secret from the secret store
        # Used for every property below that does not set its own remoteRefKey
        remoteRefKey: "limina-ui"
        # The properties to pull from the secret store into the ui environment variables
        # secretKey is the environment variable name, and property is the name of the property in your secret store that holds its value
        # Update each property to match your secret store. If property is not set, it defaults to secretKey
        # Set remoteRefKey on a property to read it from a different secret in the secret store. If not set, it defaults to the remoteRefKey above
        # Set this to [] to add every property from the remoteRefKey secret above instead
        properties:
          - secretKey: "BETTER_AUTH_SECRET"
            property: "BETTER_AUTH_SECRET" # Enter the property containing your auth secret, a long random string
          - secretKey: "GOOGLE_CLIENT_ID"
            property: "GOOGLE_CLIENT_ID" # Enter the property containing your Google OAuth client id
          - secretKey: "GOOGLE_CLIENT_SECRET"
            property: "GOOGLE_CLIENT_SECRET" # Enter the property containing your Google OAuth client secret
      # Configuration for the Limina Platform ui TLS secret
      tls:
        # Enables or disables external secret for TLS
        enabled: false
        # Optional annotations for the ui tls externalsecret and secret objects
        annotations: {}
        # Example annotations
        # annotations:
        #   annotation-key1: "annotation-value1"
        #   annotation-key2: "annotation-value2"
        # Set the refresh interval to check for updated secrets
        refreshInterval: "1h"
        # This is the reference to the name of the secret from the secret store
        # The secret must contain a PKCS#12 certificate bundle, see the README for details
        remoteRefKey: "limina-ui-tls"
